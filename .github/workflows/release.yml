name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  bootstrap-v0-1-0:
    name: Bootstrap v0.1.0 tag
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'prepare AtlasMesh v0.1.0 release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create release tag once
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.1.0 -m 'Karzoun AtlasMesh v0.1.0'
          git push origin v0.1.0

  publish-v0-1-0-bootstrap:
    name: Publish v0.1.0 bootstrap artifacts
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'publish AtlasMesh v0.1.0 artifacts')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out the existing v0.1.0 tag
        run: git checkout --detach v0.1.0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.1.0'
          mkdir -p dist
          build() {
            local os="$1" arch="$2" ext="$3"
            local out="dist/atlasmesh-${VERSION}-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$out" ./cmd/atlasmesh
          }
          build linux amd64 ''
          build linux arm64 ''
          build darwin amd64 ''
          build darwin arm64 ''
          build windows amd64 '.exe'
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 dist/* --verify-tag --title 'Karzoun AtlasMesh v0.1.0' --generate-notes
      - name: Login to GitHub Container Registry
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push container image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg VERSION='0.1.0' -t "$IMAGE:0.1.0" -t "$IMAGE:latest" .
          docker push "$IMAGE:0.1.0"
          docker push "$IMAGE:latest"

  publish:
    name: Publish release and GHCR image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p dist
          build() {
            local os="$1" arch="$2" ext="$3"
            local out="dist/atlasmesh-${VERSION}-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$out" ./cmd/atlasmesh
          }
          build linux amd64 ''
          build linux arm64 ''
          build darwin amd64 ''
          build darwin arm64 ''
          build windows amd64 '.exe'
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "Karzoun AtlasMesh ${GITHUB_REF_NAME}" --generate-notes
      - name: Login to GitHub Container Registry
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push container image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          docker build --build-arg VERSION="$VERSION" -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
