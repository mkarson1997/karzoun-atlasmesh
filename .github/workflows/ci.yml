name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.8', '1.27.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build -trimpath ./cmd/atlasmesh

  vulnerability-scan:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run pinned govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  ci-gate:
    name: CI Gate
    if: always()
    needs: [verify, vulnerability-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce required jobs
        if: needs.verify.result != 'success' || needs.vulnerability-scan.result != 'success'
        run: exit 1
      - name: Confirm green build
        if: needs.verify.result == 'success' && needs.vulnerability-scan.result == 'success'
        run: echo 'All AtlasMesh CI checks passed.'
